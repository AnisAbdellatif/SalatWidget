[package]
name = "salatwidget"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "SalatWidget for Linux (and later Windows): the next prayer and a countdown in the tray."

[workspace]
# The XFCE panel plugin is its own crate so the tray app never links libxfce4panel
# (and keeps running on GNOME, KDE and others).
members = [".", "xfce-plugin"]
default-members = ["."]

[lib]
path = "src/lib.rs"

[[bin]]
name = "salatwidget"
path = "src/main.rs"

[dependencies]
# The shared prayer-time core: the MawaKit git submodule at the repo root.
mawakit = { path = "../../MawaKit" }
jiff = "0.2.38"
tray-icon = "0.26.1"
ureq = "3.5.0"
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
# tray-icon's Linux backend (AppIndicator) runs on GTK's main loop.
gtk = "0.18"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
